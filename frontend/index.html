<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />

    <!-- ======================================================
         HUELLAPP
         Configuración general del documento
         ====================================================== -->

    <!--
      Favicon mostrado en la pestaña del navegador.
      Debe existir dentro de /public.
    -->
    <link
      rel="icon"
      type="image/png"
      href="/logo-huella.png"
    />

    <!--
      Evita que Google Chrome sugiera traducir la aplicación.
      HuellAPP está definida como aplicación en español.
    -->
    <meta
      name="google"
      content="notranslate"
    />

    <!--
      Configuración responsive.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!--
      Nombre visible en la pestaña del navegador.
    -->
    <title>HuellApp</title>
  </head>

  <body translate="no">
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
